<!DOCTYPE html><html class="dark" lang="tr"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#121316;}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "outline": "#ab8980", "on-tertiary-fixed": "#151c26", "tertiary": "#c0c7d5", "on-primary-fixed-variant": "#862200", "surface-container-lowest": "#0d0e11", "background": "#121316", "secondary-fixed": "#e1e2e4", "on-error-container": "#ffdad6", "inverse-primary": "#b02f00", "on-tertiary-fixed-variant": "#404752", "surface-container-low": "#1b1b1f", "on-secondary-container": "#b4b5b7", "surface-container": "#1f1f23", "on-secondary-fixed": "#191c1e", "on-tertiary": "#2a313b", "on-tertiary-container": "#232a35", "on-surface-variant": "#e4beb4", "tertiary-fixed": "#dce3f1", "surface-container-high": "#292a2d", "secondary": "#c5c6c8", "on-secondary": "#2e3132", "surface-dim": "#121316", "on-surface": "#e3e2e6", "on-background": "#e3e2e6", "on-primary": "#5f1500", "on-secondary-fixed-variant": "#444749", "error-container": "#93000a", "surface-bright": "#38393c", "primary-container": "#ff5722", "error": "#ffb4ab", "primary": "#ffb5a0", "secondary-container": "#444749", "tertiary-container": "#8a919e", "on-error": "#690005", "tertiary-fixed-dim": "#c0c7d5", "inverse-on-surface": "#303034", "surface-variant": "#343538", "surface-tint": "#ffb5a0", "on-primary-container": "#541200", "surface-container-highest": "#343538", "surface": "#121316", "primary-fixed-dim": "#ffb5a0", "on-primary-fixed": "#3b0900", "primary-fixed": "#ffdbd1", "inverse-surface": "#e3e2e6", "secondary-fixed-dim": "#c5c6c8", "outline-variant": "#5b4039" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "margin": "1.25rem", "space-xl": "1.75rem", "space-md": "1rem", "space-lg": "1.25rem", "gutter": "1rem", "gutter-sm": "0.75rem", "margin-mobile": "1rem", "space-xs": "0.25rem" }, "fontFamily": { "display-hero": ["Inter"], "body-lg": ["Inter"], "metric-val": ["Inter"], "headline-md": ["Inter"], "body-sm": ["Inter"], "label-xs": ["Inter"], "headline-lg": ["Inter"], "headline-lg-mobile": ["Inter"], "label-md": ["Inter"] }, "fontSize": { "display-hero": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.04em", "fontWeight": "800" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "metric-val": ["28px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-xs": ["10px", { "lineHeight": "12px", "letterSpacing": "0.06em", "fontWeight": "700" }], "headline-lg": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "headline-lg-mobile": ["26px", { "lineHeight": "32px", "letterSpacing": "-0.025em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-sm text-body-sm text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl pt-safe"><div class="h-16 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-sm"><span class="font-headline-md text-headline-md tracking-tight uppercase text-on-surface">GRIND</span></div></div></header><main class="flex flex-col relative w-full pt-16 pb-24 bg-surface min-h-screen"><div class="flex flex-col w-full px-margin-mobile pb-space-xl">
<div class="flex flex-col items-center text-center mt-space-md mb-space-lg">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-surface-container-high mb-space-sm text-primary">
<span class="material-symbols-outlined text-[28px]">fitness_center</span>
</div>
<span class="font-headline-lg-mobile text-headline-lg-mobile uppercase tracking-tight text-on-surface">GRIND</span>
<p class="font-body-sm text-body-sm text-secondary mt-space-xs">Güç antrenmanı günlüğü</p>
</div>
<div class="bg-surface-container-low rounded-xl p-space-md shadow-md flex flex-col gap-space-md">
<div class="flex flex-col gap-1 pb-space-xs">
<h1 class="font-headline-md text-headline-md text-on-surface">Kayıt ol</h1>
<p class="font-body-sm text-body-sm text-secondary">Ağırlıklarını ve gelişimini anlık takip etmeye başla.</p>
</div>
<form class="flex flex-col gap-space-md" id="register-form" onsubmit="event.preventDefault(); handleRegister();">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="username">Kullanıcı adı</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary text-[20px] pointer-events-none">alternate_email</span>
<input autocomplete="username" class="w-full h-12 pl-10 pr-4 bg-surface-container rounded-xl font-body-sm text-body-sm text-on-surface placeholder:text-secondary/50 focus:bg-surface-container-high focus:outline-none transition-colors" id="username" name="username" placeholder="ornek_kullanici" required="" type="text">
</div>
<span class="font-label-xs text-label-xs text-secondary pl-1">3–50 karakter (harf, rakam, _ ve -)</span>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Şifre</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary text-[20px] pointer-events-none">lock</span>
<input autocomplete="new-password" class="w-full h-12 pl-10 pr-12 bg-surface-container rounded-xl font-body-sm text-body-sm text-on-surface placeholder:text-secondary/50 focus:bg-surface-container-high focus:outline-none transition-colors" id="password" minlength="8" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Şifreyi göster" class="absolute right-1 w-11 h-11 flex items-center justify-center text-secondary hover:text-on-surface focus:outline-none" onclick="togglePasswordVisibility('password', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<span class="font-label-xs text-label-xs text-secondary pl-1">En az 8 karakter</span>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="password-confirm">Şifre tekrarı</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary text-[20px] pointer-events-none">lock_reset</span>
<input autocomplete="new-password" class="w-full h-12 pl-10 pr-12 bg-surface-container rounded-xl font-body-sm text-body-sm text-on-surface placeholder:text-secondary/50 focus:bg-surface-container-high focus:outline-none transition-colors" id="password-confirm" minlength="8" name="password_confirm" placeholder="••••••••" required="" type="password">
<button aria-label="Şifre tekrarını göster" class="absolute right-1 w-11 h-11 flex items-center justify-center text-secondary hover:text-on-surface focus:outline-none" onclick="togglePasswordVisibility('password-confirm', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<span class="font-label-xs text-label-xs text-error pl-1" id="password-match-msg" style="opacity: 0;">Şifreler eşleşmiyor.</span>
</div>
<div class="pt-space-xs">
<button class="w-full h-[52px] bg-primary-container hover:bg-primary-container/90 active:scale-[0.99] rounded-xl font-headline-md text-body-lg text-on-primary-container flex items-center justify-center gap-space-xs shadow-lg transition-transform" id="submit-btn" type="submit">
<span class="material-symbols-outlined text-[22px]">how_to_reg</span>
<span class="">Kayıt ol</span>
</button>
</div>
</form>
<div class="flex items-center justify-center pt-space-xs pb-space-xs">
<p class="font-body-sm text-body-sm text-secondary">
        Zaten hesabın var mı?
        <a class="font-label-md text-primary hover:underline ml-1 inline-flex items-center min-h-[44px]" data-path="login" href="#">
          Giriş yap
        </a>
</p>
</div>
</div>

</div>
<script>
  function togglePasswordVisibility(fieldId, buttonEl) {
    const input = document.getElementById(fieldId);
    const icon = buttonEl.querySelector('.material-symbols-outlined');
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
      buttonEl.setAttribute('aria-label', 'Şifreyi gizle');
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
      buttonEl.setAttribute('aria-label', 'Şifreyi göster');
    }
  }

  function handleRegister() {
    const pwd = document.getElementById('password').value;
    const pwdConfirm = document.getElementById('password-confirm').value;
    const matchMsg = document.getElementById('password-match-msg');
    const submitBtn = document.getElementById('submit-btn');

    if (pwd !== pwdConfirm) {
      matchMsg.classList.remove('hidden');
      return;
    }

    matchMsg.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="material-symbols-outlined text-[22px] animate-spin">progress_activity</span><span>Kaydediliyor...</span>';

    setTimeout(() => {
      submitBtn.innerHTML = '<span class="material-symbols-outlined text-[22px]">check_circle</span><span>Ba&#351;ar&#305;l&#305;! Y&ouml;nlendiriliyor...</span>';
    }, 900);
  }
</script></main>

</body></html>
