mary-fixed": "#ffdbd1", "inverse-surface": "#e3e2e6", "secondary-fixed-dim": "#c5c6c8", "outline-variant": "#5b4039" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "margin": "1.25rem", "space-xl": "1.75rem", "space-md": "1rem", "space-lg": "1.25rem", "gutter": "1rem", "gutter-sm": "0.75rem", "margin-mobile": "1rem", "space-xs": "0.25rem" }, "fontFamily": { "display-hero": ["Inter"], "body-lg": ["Inter"], "metric-val": ["Inter"], "headline-md": ["Inter"], "body-sm": ["Inter"], "label-xs": ["Inter"], "headline-lg": ["Inter"], "headline-lg-mobile": ["Inter"], "label-md": ["Inter"] }, "fontSize": { "display-hero": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.04em", "fontWeight": "800" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "metric-val": ["28px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-xs": ["10px", { "lineHeight": "12px", "letterSpacing": "0.06em", "fontWeight": "700" }], "headline-lg": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "headline-lg-mobile": ["26px", { "lineHeight": "32px", "letterSpacing": "-0.025em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-sm text-body-sm text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl pt-safe"><div class="h-16 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-sm"><span class="font-headline-md text-headline-md tracking-tight uppercase text-on-surface">GRIND</span></div></div></header><main class="flex flex-col relative w-full pt-16 pb-24 bg-surface min-h-screen"><div class="flex flex-col w-full px-margin-mobile pb-space-xl">
<div class="flex flex-col pt-space-md mb-space-xl">
<div class="flex items-center gap-space-xs mb-space-xs">
<span class="font-display-hero text-display-hero uppercase tracking-tighter text-on-surface">GRIND</span>

</div>
<p class="font-body-sm text-body-sm text-secondary tracking-normal">Güç antrenmanı günlüğü</p>
</div>
<div class="bg-surface-container-low rounded-xl p-space-lg shadow-md flex flex-col gap-space-lg">
<div class="flex items-center justify-between">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Giriş yap</h1>

</div>
<!-- Error Alert Card -->
<div class="flex items-start gap-space-sm p-space-md rounded-lg bg-error-container text-on-error-container transition-all" id="error-banner">
<span class="material-symbols-outlined text-[20px] text-error shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span>
<div class="flex flex-col">
<span class="font-label-md text-label-md font-bold text-on-error-container">Giriş başarısız</span>
<span class="font-body-sm text-body-sm text-on-error-container">Kullanıcı adı veya şifre hatalı.</span>
</div>
</div>
<form class="flex flex-col gap-space-md" id="login-form" onsubmit="event.preventDefault();">
<!-- Username Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="username">
          Kullanıcı adı
        </label>
<div class="relative flex items-center">
<input autocapitalize="none" autocomplete="username" class="w-full h-14 pl-space-md pr-12 rounded-xl bg-surface-container text-on-surface placeholder:text-secondary-container font-body-lg text-body-lg focus:outline-none focus:bg-surface-container-high transition-colors" id="username" placeholder="kullaniciadi" spellcheck="false" type="text" value="demir_88">
<div class="absolute right-0 top-0 bottom-0 w-12 flex items-center justify-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">
            Şifre
          </label>

</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-14 pl-space-md pr-14 rounded-xl bg-surface-container text-on-surface placeholder:text-secondary-container font-body-lg text-body-lg tracking-widest focus:outline-none focus:bg-surface-container-high transition-colors" id="password" placeholder="••••••••" type="password" value="demir1234">
<button aria-label="Şifreyi göster veya gizle" class="absolute right-1 top-1 bottom-1 w-12 h-12 flex items-center justify-center rounded-lg text-secondary hover:text-on-surface active:bg-surface-container-highest transition-colors focus:outline-none" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-[22px]" id="password-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Submit CTA Button -->
<div class="pt-space-xs flex flex-col gap-space-sm">
<button class="w-full h-14 rounded-xl bg-primary-container hover:bg-opacity-95 active:scale-[0.99] text-on-surface font-body-lg text-body-lg font-bold tracking-wide flex items-center justify-center gap-space-xs shadow-md transition-transform" id="submit-btn" type="submit">
<span class="">Giriş yap</span>

</button>
</div>
</form>
</div>
<!-- Bottom Switch Links -->
<div class="flex flex-col items-center justify-center mt-space-xl text-center">
<p class="font-body-sm text-body-sm text-secondary">
      Hesabın yok mu?
      <a class="font-body-sm text-body-sm text-primary font-bold hover:underline ml-1" href="#">
        Kayıt ol
      </a>
</p>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password-btn');
    const passwordIcon = document.getElementById('password-icon');
    const loginForm = document.getElementById('login-form');
    const errorBanner = document.getElementById('error-banner');

    if (toggleBtn && passwordInput && passwordIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        passwordIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
        if (isPassword) {
          passwordInput.classList.remove('tracking-widest');
        } else {
          passwordInput.classList.add('tracking-widest');
        }
      });
    }

    if (loginForm && errorBanner) {
      loginForm.addEventListener('submit', function() {
        errorBanner.classList.remove('hidden');
        errorBanner.animate([
          { transform: 'translateX(-4px)' },
          { transform: 'translateX(4px)' },
          { transform: 'translateX(-2px)' },
          { transform: 'translateX(0)' }
        ], {
          duration: 300,
          easing: 'ease-out'
        });
      });
    }
  })();
</script></main>

</body></html>
