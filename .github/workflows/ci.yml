name: CI

on:
  pull_request:
    branches: [master, dev]
    # Yalnizca frontend'i degistiren bir commit icin Postgres kaldirip tum .NET testlerini
    # kosmanin anlami yok. Backend'i etkileyen her sey (docs dahil) tetiklemeye devam eder.
    paths-ignore: ['web/**']
  push:
    branches: [master, dev]
    paths-ignore: ['web/**']

# Ayni branch'e arka arkaya push yapilinca devam eden eski run iptal edilir.
# DIKKAT: ileride eklenecek frontend workflow'u FARKLI bir grup adi kullanmali (or. web-...).
# Ayni grubu paylasirlarsa ayni branch'te birbirlerini iptal ederler ve .NET testleri sessizce
# kosmamaya baslar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Derle ve test et
    runs-on: ubuntu-latest

    # Duman testleri gercek bir PostgreSQL istiyor. docker-compose.yml ile ayni
    # imaj, ayni kimlik bilgileri, ayni host portu (5433) — testlerdeki baglanti
    # dizesi birebir calissin diye.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: grind
          POSTGRES_USER: grind
          POSTGRES_PASSWORD: grind_dev_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U grind -d grind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # user-secrets CI'da yok; ASP.NET Core yapilandirmasi ortam degiskenlerinde
      # ':' yerine '__' kullanir.
      ConnectionStrings__Postgres: "Host=localhost;Port=5433;Database=grind;Username=grind;Password=grind_dev_password"

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: .NET 10 SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet paketlerini onbellekten al
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Bagimliliklari geri yukle
        run: dotnet restore

      - name: Derle
        run: dotnet build --no-restore --configuration Release

      # dotnet-ef surumu .config/dotnet-tools.json'da sabitli — her run'da en son
      # surumu cekip bir gun sessizce kirilmasin diye.
      - name: EF Core araclarini geri yukle
        run: dotnet tool restore

      # Sema ile model arasindaki sessiz ayrisma bu projede en pahali hata sinifi:
      # biri bir konfigurasyon sinifini degistirip migration uretmeyi unutursa
      # burada durur. Drift yoksa 0, varsa 1 doner.
      - name: Migration drift kontrolu
        run: dotnet dotnet-ef migrations has-pending-model-changes --project src/Grind.Api --configuration Release --no-build

      - name: Semayi uygula (migration)
        run: dotnet dotnet-ef database update --project src/Grind.Api --configuration Release --no-build

      - name: Testleri calistir
        run: dotnet test --no-build --configuration Release --verbosity normal
