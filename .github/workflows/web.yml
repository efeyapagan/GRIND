name: Web CI

on:
  pull_request:
    branches: [master, dev]
    paths: ['web/**', 'packages/shared/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  push:
    branches: [master, dev]
    paths: ['web/**', 'packages/shared/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']

# DIKKAT: grup adi .NET CI'inkinden (ci-...) FARKLI olmali; ayni grup ayni branch'te
# birbirlerini iptal eder.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Derle ve test et
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspaces: web, `@grind/shared` sembolik baglantisi kok kurulumla olusur --
      # `web/` icinde tek basina `npm ci` calistirmak bu paketi cozemez (registry'de yok).
      - name: Bagimliliklari kur (kok, workspaces)
        run: npm ci

      - name: Tip kontrolu
        run: npm run typecheck --workspace web

      - name: Testler
        run: npm run test --workspace web

      - name: Derle
        run: npm run build --workspace web
