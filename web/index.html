<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121316" />
    <script>
      // #178: ilk boyada tema sicramasini onler -- Vite'in modul script'i `defer` oldugu icin
      // React'tan once calisabilecek tek yer burasi. Asil mantik web/src/lib/tema.ts'te; anahtar
      // ve renkler modul ice aktarilamadigi icin burada da yazili (tema.test.ts ikisini esler).
      (function () {
        var tercih = localStorage.getItem('grind.tema');
        var acik =
          tercih === 'acik' ||
          (tercih !== 'koyu' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = acik ? 'light' : 'dark';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', acik ? '#fdf8f6' : '#121316');
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>GRIND</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
