services:
  db:
    image: postgres:17-alpine
    container_name: grind-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: grind
      POSTGRES_USER: grind
      POSTGRES_PASSWORD: grind_dev_password
    ports:
      - "5433:5432"
    volumes:
      - grind-db-data:/var/lib/postgresql/data
      # Ilk acilista `grind_test`i de olusturur (#459).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grind -d grind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grind-db-data:
